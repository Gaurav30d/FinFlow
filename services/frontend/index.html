<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="FinFlow — High-throughput digital banking platform with real-time settlements, cryptographic idempotency, and Gemini AI financial intelligence." />
    <meta name="theme-color" content="#0a0d14" />
    <title>FinFlow — Digital Banking & Financial Intelligence</title>

    <!-- Google Fonts: Plus Jakarta Sans for UI & JetBrains Mono for figures -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Flash-free Theme Initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('finflow_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-50 dark:bg-[#0c0e14] text-neutral-900 dark:text-neutral-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

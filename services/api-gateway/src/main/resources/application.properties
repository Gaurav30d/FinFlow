server.port=8080

spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/api/auth/(?<segment>.*), /auth/${segment}

spring.cloud.gateway.server.webflux.routes[1].id=transaction-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://transaction-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/transactions,/api/transactions/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/api/transactions(?<segment>/?.*), /transactions${segment}

spring.cloud.gateway.server.webflux.routes[2].id=account-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/accounts,/api/accounts/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/api/accounts(?<segment>/?.*), /accounts${segment}

spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications,/api/notifications/**

spring.cloud.gateway.server.webflux.routes[4].id=ai-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://transaction-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/ai,/api/ai/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/api/ai(?<segment>/?.*), /api/ai${segment}

jwt.secret=${JWT_SECRET}
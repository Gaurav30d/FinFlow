spring.application.name=audit-service
server.port=8085

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/finflow_audit?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=finflow-audit-group
spring.kafka.consumer.auth-group-id=finflow-audit-auth-group
spring.kafka.consumer.account-group-id=finflow-audit-account-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false